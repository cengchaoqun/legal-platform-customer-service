[project]
name = "legal-demo-business-service"
version = "1.0.0"
description = "法律平台演示业务服务：套餐、订单、进度、发票与售后事实"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
